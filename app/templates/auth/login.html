{% extends "base.html" %}

{% block title %}Sign In | LifeLine Connect{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto 2rem auto;">
  <div class="glass-card" style="border-top: 4px solid var(--crimson-500); padding: 2.25rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon" style="margin: 0 auto 1rem auto; width: 48px; height: 48px;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="white">
          <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
        </svg>
      </div>
      <h1 style="font-size: 1.75rem; margin-bottom: 0.35rem;">Welcome Back</h1>
      <p style="color: var(--text-secondary); font-size: 0.9rem;">Sign in to access LifeLine Connect Network</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
      <div class="form-group">
        <label class="form-label">Username or Email</label>
        <input type="text" name="identifier" id="login-identifier" class="form-control" required placeholder="e.g. admin or kasun.fernando@email.lk" autofocus>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" id="login-password" class="form-control" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
        Sign In to Portal
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary); border-top: 1px solid var(--border-subtle); padding-top: 1.25rem;">
      Don't have an account? <a href="{{ url_for('auth.register') }}" style="font-weight: 600;">Register here</a>
    </div>

    <!-- Quick Fill Demo Accounts -->
    <div style="margin-top: 1.5rem; background: rgba(13, 21, 39, 0.9); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 0.9rem;">
      <div style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 0.5rem;">
        Sri Lankan Demo Accounts (Quick Fill):
      </div>
      <div style="display: flex; gap: 0.4rem; flex-wrap: wrap;">
        <button type="button" class="btn btn-sm btn-outline" onclick="fillDemo('admin', 'AdminPass123#')">
          Admin
        </button>
        <button type="button" class="btn btn-sm btn-outline" onclick="fillDemo('dr_perera', 'StaffPass123#')">
          Dr. Perera (NBTS)
        </button>
        <button type="button" class="btn btn-sm btn-outline" onclick="fillDemo('kasun_fernando', 'DonorPass123#')">
          Kasun (Donor)
        </button>
        <button type="button" class="btn btn-sm btn-outline" onclick="fillDemo('nhsl_colombo', 'HospPass123#')">
          NHSL Colombo (Hospital)
        </button>
      </div>
    </div>
  </div>
</div>

<script>
function fillDemo(username, password) {
  document.getElementById('login-identifier').value = username;
  document.getElementById('login-password').value = password;
}
</script>
{% endblock %}
