{% extends "base.html" %}

{% block title %}Register Account | LifeLine Connect{% endblock %}

{% block content %}
<div style="max-width: 550px; margin: 2rem auto 2rem auto;">
  <div class="glass-card" style="border-top: 4px solid var(--crimson-500); padding: 2.25rem;">
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <h1 style="font-size: 1.75rem; margin-bottom: 0.35rem;">Create an Account</h1>
      <p style="color: var(--text-secondary); font-size: 0.9rem;">Join the LifeLine Connect Blood Network</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="form-group">
        <label class="form-label">Full Name *</label>
        <input type="text" name="full_name" class="form-control" required placeholder="e.g. Jordan Belfort">
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Username *</label>
          <input type="text" name="username" class="form-control" required placeholder="e.g. jbelfort">
        </div>

        <div class="form-group">
          <label class="form-label">Role Account Type *</label>
          <select name="role" class="form-select" required>
            <option value="DONOR">Blood Donor</option>
            <option value="STAFF">Medical Volunteer / Staff</option>
            <option value="HOSPITAL">Hospital Procurement</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address *</label>
        <input type="email" name="email" class="form-control" required placeholder="e.g. jbelfort@example.com">
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Password * (Min 6 chars)</label>
          <input type="password" name="password" class="form-control" required placeholder="••••••••" minlength="6">
        </div>

        <div class="form-group">
          <label class="form-label">Confirm Password *</label>
          <input type="password" name="confirm_password" class="form-control" required placeholder="••••••••" minlength="6">
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
        Complete Registration
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary); border-top: 1px solid var(--border-subtle); padding-top: 1.25rem;">
      Already have an account? <a href="{{ url_for('auth.login') }}" style="font-weight: 600;">Sign in here</a>
    </div>
  </div>
</div>
{% endblock %}
